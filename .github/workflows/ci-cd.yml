name: mlops-search-ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  HELM_DRIVER: configmap
  KUBE_NAMESPACE: mlops-students

# TODO(student): добавьте concurrency для сериализации deployment.

jobs:
  test-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_index.py --output artifacts
      - run: pytest -q
      - run: python scripts/evaluate.py --artifact-dir artifacts
      # TODO(student): отрицательный quality control.

